<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT クイズ — Words · Kanji · Grammar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --n5: #16a34a; --n4: #0d9488; --n3: #2563eb; --n2: #7c3aed; --n1: #e11d48;
    --ink: #1a1333;
    --muted: #5b5670;
    --card: #ffffff;
    --line: rgba(26,19,51,.1);
    --ok: #059669;
    --bad: #e11d48;
    --shadow: 0 18px 50px rgba(88, 28, 135, .16);
    --level: var(--n5);
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Noto Sans JP", "Nunito", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at -10% -20%, #ffd6e8 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 0%, #c4e4ff 0%, transparent 50%),
      radial-gradient(800px 500px at 80% 110%, #ffe9a8 0%, transparent 55%),
      linear-gradient(165deg, #fff7fb 0%, #eef4ff 50%, #fff5e9 100%);
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: radial-gradient(rgba(255,255,255,.55) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: .45;
  }
  .app { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 20px 18px 48px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 46px; height: 46px; border-radius: 16px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--level), #fb7185);
    color: #fff; font-family: Nunito, sans-serif; font-weight: 900; font-size: 18px;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--level) 50%, transparent);
  }
  .brand h1 { font-family: Nunito, sans-serif; font-size: 1.35rem; letter-spacing: -.03em; }
  .brand p { color: var(--muted); font-size: .82rem; }
  .pill {
    background: #fff; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: .78rem; color: var(--muted); font-weight: 700;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px 24px;
    border: 1px solid rgba(255,255,255,.8);
    animation: rise .45s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  h2.section { font-size: 1.15rem; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
  .label { font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; }
  .grid { display: grid; gap: 8px; }
  .levels { grid-template-columns: repeat(5, 1fr); }
  .kinds, .counts { grid-template-columns: repeat(3, 1fr); }
  .modes { grid-template-columns: 1fr; }
  button.opt, button.choice, button.cta, button.ghost {
    font: inherit; cursor: pointer; border: none;
  }
  button.opt {
    background: #f6f3ff;
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 11px 8px;
    font-weight: 800;
    color: var(--ink);
    min-height: 48px;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
  }
  button.opt:hover { transform: translateY(-1px); }
  button.opt.on {
    background: color-mix(in srgb, var(--level) 14%, #fff);
    border-color: var(--level);
    color: var(--level);
    box-shadow: 0 6px 16px color-mix(in srgb, var(--level) 25%, transparent);
  }
  button.opt.mode { text-align: left; padding: 12px 16px; font-weight: 700; }
  button.opt.mode small { display: block; font-weight: 500; color: var(--muted); }
  button.cta {
    width: 100%; margin-top: 22px; min-height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--level), #fb7185);
    color: #fff; font-weight: 900; font-size: 1.05rem; letter-spacing: .02em;
    box-shadow: 0 12px 24px color-mix(in srgb, var(--level) 40%, transparent);
  }
  button.cta:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost {
    background: #fff; color: var(--ink); border: 2px solid var(--line);
    border-radius: 14px; min-height: 52px; padding: 0 16px; font-weight: 800;
  }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat {
    background: #f7f4ff; border-radius: 14px; padding: 10px 8px; text-align: center;
  }
  .stat b { display: block; font-family: Nunito, sans-serif; font-size: 1.2rem; color: var(--level); }
  .stat span { font-size: .7rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
  .progress { height: 10px; background: #efeaf8; border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--level), #fb7185); transition: width .35s ease; }
  .prompt-box { text-align: center; padding: 10px 4px 18px; }
  .prompt {
    font-weight: 900; line-height: 1.25; letter-spacing: .02em;
    font-size: clamp(2rem, 8vw, 3.1rem);
    animation: rise .35s ease both;
  }
  .prompt.meaning, .prompt.grammar { font-size: clamp(1.2rem, 4.5vw, 1.7rem); font-weight: 800; line-height: 1.45; }
  .sub { margin-top: 8px; color: var(--muted); font-size: 1rem; }
  .choices { display: grid; gap: 10px; }
  button.choice {
    text-align: left; background: #fff; border: 2px solid #ece7f7;
    border-radius: 16px; padding: 14px 16px; min-height: 56px;
    font-weight: 700; font-size: 1.02rem;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  button.choice small { display: block; color: var(--muted); font-weight: 500; font-size: .85rem; margin-top: 2px; }
  button.choice:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--level) 50%, #ece7f7); }
  button.choice.ok { background: #ecfdf5; border-color: var(--ok); color: #065f46; }
  button.choice.bad { background: #fff1f2; border-color: var(--bad); color: #9f1239; animation: shake .35s ease; }
  button.choice:disabled { cursor: default; }
  .flash-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .flip {
    background: linear-gradient(180deg, #fff, #f8f4ff); border: 2px dashed #ddd6fe;
    border-radius: 20px; padding: 28px 16px; text-align: center; cursor: pointer; min-height: 160px;
  }
  .flip .back { display: none; }
  .flip.show .front { display: none; }
  .flip.show .back { display: block; animation: pop .35s ease; }
  .feedback {
    margin-top: 16px; border-radius: 18px; padding: 16px;
    animation: rise .3s ease both;
  }
  .feedback.ok { background: #ecfdf5; border: 1px solid #a7f3d0; }
  .feedback.bad { background: #fff1f2; border: 1px solid #fecdd3; }
  .feedback h3 { font-size: 1rem; margin-bottom: 6px; }
  .example { margin-top: 10px; font-size: .98rem; line-height: 1.7; }
  .example .ja { font-weight: 700; }
  .example .en { color: var(--muted); }
  .example ruby { ruby-position: over; }
  ruby rt { font-size: .45em; color: #7c3aed; font-weight: 700; }
  .meta { color: var(--muted); font-size: .88rem; margin-top: 6px; line-height: 1.55; }
  .toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-20px);
    background: #1a1333; color: #fff; padding: 10px 18px; border-radius: 999px;
    font-weight: 900; opacity: 0; pointer-events: none; z-index: 20;
    transition: .3s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); animation: pulse .6s ease; }
  .result-hero { text-align: center; padding: 8px 0 18px; }
  .grade {
    font-family: Nunito, sans-serif; font-weight: 900; font-size: 4rem; line-height: 1;
    background: linear-gradient(135deg, var(--level), #fb7185);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .misses { margin-top: 16px; display: grid; gap: 8px; }
  .miss {
    background: #fff7f8; border-radius: 14px; padding: 12px 14px; border: 1px solid #ffe4e6;
  }
  .miss b { display: block; }
  .miss span { color: var(--muted); font-size: .88rem; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  footer.credit {
    margin-top: 28px; text-align: center; color: var(--muted); font-size: .78rem; line-height: 1.6;
  }
  footer.credit a { color: #6d28d9; font-weight: 700; }
  .err { background: #fff1f2; color: #9f1239; padding: 12px 14px; border-radius: 12px; margin-top: 12px; }
  @media (max-width: 520px) {
    .levels { grid-template-columns: repeat(5, 1fr); }
    button.opt { font-size: .85rem; padding: 10px 4px; }
    .app { padding: 14px 12px 36px; }
  }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" id="mark">語</div>
      <div>
        <h1>JLPT クイズ</h1>
        <p>Words · Kanji · Grammar</p>
      </div>
    </div>
    <div class="pill" id="countPill">OpenJLPT</div>
  </header>

  <main id="screen"></main>

  <footer class="credit">
    Vocabulary, kanji, and grammar data from
    <a href="https://github.com/evanclan/OpenJLPT" target="_blank" rel="noopener">OpenJLPT</a>
    (CC BY-SA 4.0), which uses JMdict and KANJIDIC2 (EDRDG), Jonathan Waller’s JLPT lists, and Tatoeba.<br>
    App code MIT. Unofficial community level lists — not affiliated with the JLPT.
  </footer>
</div>
<script>
const LEVELS = ["N5","N4","N3","N2","N1"];
const LEVEL_COLOR = { N5: "#16a34a", N4: "#0d9488", N3: "#2563eb", N2: "#7c3aed", N1: "#e11d48" };
const KINDS = [
  { id: "vocab", label: "単語", en: "Words" },
  { id: "kanji", label: "漢字", en: "Kanji" },
  { id: "grammar", label: "文法", en: "Grammar" },
];
const MODES = {
  vocab: [
    { id: "kanji_to_meaning", label: "漢字 → 意味", en: "See the word, pick the meaning" },
    { id: "meaning_to_kanji", label: "意味 → 漢字", en: "See the meaning, pick the word" },
    { id: "kana_to_kanji", label: "かな → 漢字", en: "See the reading, pick the word" },
    { id: "flashcard", label: "フラッシュカード", en: "Flip the card and self-check" },
  ],
  kanji: [
    { id: "character_to_meaning", label: "漢字 → 意味", en: "See the character, pick the meaning" },
    { id: "meaning_to_character", label: "意味 → 漢字", en: "See the meaning, pick the character" },
    { id: "character_to_reading", label: "漢字 → 読み", en: "See the character, pick on/kun readings" },
  ],
  grammar: [
    { id: "pattern_to_meaning", label: "文型 → 意味", en: "See the pattern, pick the meaning" },
    { id: "meaning_to_pattern", label: "意味 → 文型", en: "See the meaning, pick the pattern" },
  ],
};

const state = {
  level: "N5",
  kind: "vocab",
  mode: "kanji_to_meaning",
  count: 10,
  catalog: null,
  session: null,
  question: null,
  result: null,
  summary: null,
  locked: false,
  flipped: false,
};

function setLevel(lv) {
  state.level = lv;
  document.documentElement.style.setProperty("--level", LEVEL_COLOR[lv]);
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function furigana(s) {
  if (!s) return "";
  return esc(s).replace(/\{([^}|]+)\|([^}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1400);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || data.error || res.statusText);
  return data;
}

function render() {
  const root = document.getElementById("screen");
  if (state.summary) root.innerHTML = renderResults();
  else if (state.question) root.innerHTML = renderPlay();
  else root.innerHTML = renderSetup();
  const marks = { vocab: "語", kanji: "漢", grammar: "文" };
  const mark = document.getElementById("mark");
  if (mark) mark.textContent = marks[state.kind] || "語";
  bind();
}

function renderSetup() {
  const modes = MODES[state.kind];
  if (!modes.find(m => m.id === state.mode)) state.mode = modes[0].id;
  const counts = state.catalog ? state.catalog.levels.find(l => l.level === state.level) : null;
  return `
    <section class="card">
      <h2 class="section">クイズをはじめる</h2>
      <p class="hint">レベル・種類・モードを選んで、同じ画面でプレイできます。</p>
      <div class="label">Level</div>
      <div class="grid levels">
        ${LEVELS.map(lv => `<button class="opt ${state.level===lv?"on":""}" data-act="level" data-v="${lv}">${lv}</button>`).join("")}
      </div>
      <div class="label">Kind</div>
      <div class="grid kinds">
        ${KINDS.map(k => `<button class="opt ${state.kind===k.id?"on":""}" data-act="kind" data-v="${k.id}">${k.label}<small style="display:block;font-weight:600;color:var(--muted)">${k.en}</small></button>`).join("")}
      </div>
      <div class="label">Mode</div>
      <div class="grid modes">
        ${modes.map(m => `<button class="opt mode ${state.mode===m.id?"on":""}" data-act="mode" data-v="${m.id}">${m.label}<small>${m.en}</small></button>`).join("")}
      </div>
      <div class="label">Questions</div>
      <div class="grid counts">
        ${[5,10,20].map(n => `<button class="opt ${state.count===n?"on":""}" data-act="count" data-v="${n}">${n}</button>`).join("")}
      </div>
      ${counts ? `<p class="hint" style="margin:16px 0 0">このレベル: 単語 ${counts.word_count} · 漢字 ${counts.kanji_count} · 文法 ${counts.grammar_count}</p>` : ""}
      <button class="cta" data-act="start">スタート</button>
    </section>`;
}

function promptClass() {
  if (state.kind === "grammar") return "prompt grammar";
  if (state.mode && state.mode.includes("meaning_to")) return "prompt meaning";
  return "prompt";
}

function renderPlay() {
  const q = state.question;
  const pct = Math.round(((q.question_num - 1) / q.total) * 100);
  const feedback = state.result ? renderFeedback(state.result) : "";
  const isFlash = q.mode === "flashcard";
  return `
    <section class="card" id="playCard">
      <div class="stats-row">
        <div class="stat"><b>${q.question_num}/${q.total}</b><span>PROGRESS</span></div>
        <div class="stat"><b>${q.score}</b><span>SCORE</span></div>
        <div class="stat"><b>${q.streak}</b><span>STREAK</span></div>
      </div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="prompt-box">
        <div class="${promptClass()}" id="prompt">${esc(q.prompt)}</div>
        ${q.prompt_sub ? `<div class="sub">${esc(q.prompt_sub)}</div>` : ""}
      </div>
      ${isFlash ? renderFlash(q) : `
        <div class="choices">
          ${(q.choices||[]).map(c => {
            let cls = "choice";
            if (state.result) {
              if (c.id === state.result.correct_choice_id) cls += " ok";
              else if (c.id === state.picked && !state.result.correct) cls += " bad";
            }
            return `<button class="${cls}" data-act="answer" data-id="${esc(c.id)}" ${state.locked?"disabled":""}>
              ${esc(c.text)}${c.sub?`<small>${esc(c.sub)}</small>`:""}
            </button>`;
          }).join("")}
        </div>`}
      ${feedback}
    </section>`;
}

function renderFlash(q) {
  return `
    <div class="flip ${state.flipped?"show":""}" data-act="flip">
      <div class="front">
        <div class="prompt">${esc(q.prompt)}</div>
        <div class="sub">${esc(q.prompt_sub || "タップして裏面へ")}</div>
      </div>
      <div class="back">
        <div class="prompt meaning">${esc(q.answer || "")}</div>
        <div class="sub">${esc(q.answer_sub || "")}</div>
      </div>
    </div>
    ${state.flipped && !state.result ? `
      <div class="flash-actions">
        <button class="ghost" data-act="self" data-ok="false">まだあやしい</button>
        <button class="cta" style="margin:0" data-act="self" data-ok="true">覚えた!</button>
      </div>` : `<p class="hint" style="text-align:center;margin-top:12px">カードをタップして答えを見る</p>`}
  `;
}

function renderFeedback(r) {
  return `
    <div class="feedback ${r.correct?"ok":"bad"}">
      <h3>${r.correct ? "正解！" : "残念…"} ${r.correct && r.streak >= 3 ? "🔥 "+r.streak+" 連続" : ""}</h3>
      <div><strong>${esc(r.correct_answer || "")}</strong> ${r.correct_sub ? `<span class="meta">${esc(r.correct_sub)}</span>` : ""}</div>
      ${r.formation ? `<div class="meta">形: ${esc(r.formation)}</div>` : ""}
      ${r.notes ? `<div class="meta">${esc(r.notes)}</div>` : ""}
      ${r.explanation ? `<div class="meta">${esc(r.explanation)}</div>` : ""}
      ${(r.example_ja || r.example_furigana) ? `
        <div class="example">
          <div class="ja">${furigana(r.example_furigana || r.example_ja)}</div>
          ${r.example_en ? `<div class="en">${esc(r.example_en)}</div>` : ""}
        </div>` : ""}
      ${r.session_finished
        ? `<button class="cta" data-act="summary">結果を見る</button>`
        : `<button class="cta" data-act="next">次の問題へ</button>`}
    </div>`;
}

function renderResults() {
  const s = state.summary;
  return `
    <section class="card">
      <div class="result-hero">
        <div class="grade">${esc((s.grade||"").split("（")[0] || "—")}</div>
        <p class="hint">${esc(s.grade || "")} · ${Math.round(s.accuracy_pct || 0)}% · ${s.duration || ""}</p>
      </div>
      <div class="stats-row">
        <div class="stat"><b>${s.correct}/${s.total}</b><span>CORRECT</span></div>
        <div class="stat"><b>${s.score}</b><span>SCORE</span></div>
        <div class="stat"><b>${s.best_streak}</b><span>BEST STREAK</span></div>
      </div>
      <div class="label">復習リスト / Misses</div>
      <div class="misses">
        ${(s.misses && s.misses.length) ? s.misses.map(m => `
          <div class="miss"><b>${esc(m.prompt)}</b><span>${esc(m.answer || "")}${m.reading ? " · "+esc(m.reading) : ""}</span></div>
        `).join("") : `<p class="hint">全問正解、すばらしい！</p>`}
      </div>
      <div class="actions">
        <button class="ghost" data-act="setup">設定に戻る</button>
        <button class="cta" style="margin:0" data-act="start">もう一度</button>
      </div>
    </section>`;
}

function bind() {
  document.querySelectorAll("[data-act]").forEach(el => {
    el.addEventListener("click", ev => {
      ev.preventDefault();
      onAction(el.dataset.act, el);
    });
  });
}

async function onAction(act, el) {
  try {
    if (act === "level") { setLevel(el.dataset.v); render(); }
    else if (act === "kind") { state.kind = el.dataset.v; state.mode = MODES[state.kind][0].id; render(); }
    else if (act === "mode") { state.mode = el.dataset.v; render(); }
    else if (act === "count") { state.count = Number(el.dataset.v); render(); }
    else if (act === "start") await startQuiz();
    else if (act === "answer") await answer(el.dataset.id, el);
    else if (act === "flip") { state.flipped = true; render(); }
    else if (act === "self") await answerSelf(el.dataset.ok === "true");
    else if (act === "next") {
      state.question = state.result.next_question;
      state.result = null;
      state.picked = null;
      state.flipped = false;
      state.locked = false;
      render();
    }
    else if (act === "summary") await loadSummary();
    else if (act === "setup") {
      state.session = state.question = state.result = state.summary = null;
      state.locked = state.flipped = false;
      state.picked = null;
      render();
    }
  } catch (err) {
    const box = document.getElementById("screen");
    box.insertAdjacentHTML("beforeend", `<div class="err">${esc(err.message)}</div>`);
  }
}

async function startQuiz() {
  state.summary = state.result = null;
  state.flipped = state.locked = false;
  state.picked = null;
  const data = await api("/api/v1/quiz/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ level: state.level, kind: state.kind, mode: state.mode, count: state.count }),
  });
  state.session = data.session_id;
  state.question = data.first_question;
  render();
}

async function answer(choiceId, btn) {
  if (state.locked) return;
  state.locked = true;
  const q = state.question;
  const data = await api("/api/v1/quiz/answer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: q.session_id, item_id: q.item_id || q.word_id, word_id: q.word_id, choice_id: choiceId }),
  });
  state.picked = choiceId;
  state.result = data;
  if (data.correct && data.streak === 3) toast("×2 ボーナス！");
  if (data.correct && data.streak === 5) toast("×3 コンボ！");
  render();
}

async function answerSelf(ok) {
  if (state.locked) return;
  state.locked = true;
  const q = state.question;
  const data = await api("/api/v1/quiz/answer", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: q.session_id, item_id: q.item_id || q.word_id, word_id: q.word_id, correct: ok }),
  });
  state.result = data;
  if (data.correct && data.streak === 3) toast("×2 ボーナス！");
  if (data.correct && data.streak === 5) toast("×3 コンボ！");
  render();
}

async function loadSummary() {
  const data = await api("/api/v1/quiz/" + state.session + "/summary");
  state.summary = data;
  state.question = state.result = null;
  render();
}

(async function init() {
  setLevel(state.level);
  try {
    const levels = await api("/api/v1/levels");
    state.catalog = levels;
    const total = levels.total_words + levels.total_kanji + levels.total_grammar;
    document.getElementById("countPill").textContent = total.toLocaleString() + " items";
  } catch (e) {
    document.getElementById("countPill").textContent = "API offline";
  }
  render();
})();
</script>
</body>
</html>
